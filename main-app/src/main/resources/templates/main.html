<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Интернет-магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Интернет-магазин</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart/items" sec:authorize="isAuthenticated()">Корзина</a>
            <a class="nav-link" href="/orders" sec:authorize="isAuthenticated()">Заказы</a>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Войти</a>
            <span class="nav-link" sec:authorize="isAuthenticated()" sec:authentication="name">Имя пользователя</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Каталог товаров</h1>
    
    <div sec:authorize="!isAuthenticated()">
        <div class="alert alert-warning">
            Для добавления товаров в корзину и оформления заказов необходимо <a href="/login">войти в систему</a>.
        </div>
    </div>

    <!-- Форма поиска -->
    <form method="get" action="/main/items" class="mb-4">
        <div class="row">
            <div class="col-md-6">
                <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Поиск товаров...">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">Найти</button>
            </div>
        </div>
    </form>

    <!-- Сортировка -->
    <div class="mb-3">
        <a th:href="@{/main/items(search=${search}, sort='PRICE_ASC')}" class="btn btn-outline-secondary">Цена ↑</a>
        <a th:href="@{/main/items(search=${search}, sort='PRICE_DESC')}" class="btn btn-outline-secondary">Цена ↓</a>
        <a th:href="@{/main/items(search=${search}, sort='NAME_ASC')}" class="btn btn-outline-secondary">Название A-Z</a>
        <a th:href="@{/main/items(search=${search}, sort='NAME_DESC')}" class="btn btn-outline-secondary">Название Z-A</a>
    </div>

    <!-- Список товаров -->
    <div class="row">
        <div th:each="item : ${items}" class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.title}">Название товара</h5>
                    <p class="card-text" th:text="${item.description}">Описание товара</p>
                    <p class="card-text"><strong th:text="${item.price}">Цена</strong> руб.</p>
                    <a th:href="@{/items/{id}(id=${item.id})}" class="btn btn-primary">Подробнее</a>
                    <form th:action="@{/main/items/{id}(id=${item.id})}" method="post" sec:authorize="isAuthenticated()" style="display: inline;">
                        <input type="hidden" name="action" value="PLUS">
                        <button type="submit" class="btn btn-success">В корзину</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <nav aria-label="Навигация по страницам">
        <ul class="pagination">
            <li class="page-item" th:if="${paging.hasPrevious}">
                <a class="page-link" 
                   th:href="@{/main/items(pageNumber=${paging.pageNumber - 1}, pageSize=${paging.pageSize}, search=${search}, sort=${sort})}">Предыдущая</a>
            </li>
            
            <li class="page-item active">
                <span class="page-link" th:text="${paging.pageNumber}">1</span>
            </li>
            
            <li class="page-item" th:if="${paging.hasNext}">
                <a class="page-link" 
                   th:href="@{/main/items(pageNumber=${paging.pageNumber + 1}, pageSize=${paging.pageSize}, search=${search}, sort=${sort})}">Следующая</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
