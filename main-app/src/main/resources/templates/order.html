<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/main/items">Интернет-магазин</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart/items" sec:authorize="isAuthenticated()">Корзина</a>
            <a class="nav-link" href="/orders" sec:authorize="isAuthenticated()">Заказы</a>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Войти</a>
            <span class="nav-link" sec:authorize="isAuthenticated()" sec:authentication="name">Имя пользователя</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div sec:authorize="!isAuthenticated()">
        <div class="alert alert-warning">
            Для просмотра заказа необходимо <a href="/login">войти в систему</a>.
        </div>
    </div>
    
    <div sec:authorize="isAuthenticated()">
        <h1 class="text-center" th:if="${newOrder}">Поздравляем! Успешная покупка! &#128578;</h1>
        
        <h2>Заказ №<span th:text="${order.id}">ID</span></h2>
        
        <table class="table">
            <thead>
                <tr>
                    <th>Товар</th>
                    <th>Изображение</th>
                    <th>Количество</th>
                    <th>Стоимость</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.items}">
                    <td><b th:text="${item.title}">Название товара</b></td>
                    <td>
                        <a th:href="${'/items/'+item.id}">
                            <img width="100" height="100" th:src="${'http://localhost:8080/'+item.image}">
                        </a>
                    </td>
                    <td><b th:text="${item.count + ' шт.'}">Количество</b></td>
                    <td><b th:text="${item.price * item.count + ' руб.'}">Стоимость</b></td>
                </tr>
            </tbody>
        </table>
        
        <div class="row">
            <div class="col-md-6">
                <h4>Итого: <span th:text="${order.totalSum()}">0</span> руб.</h4>
            </div>
        </div>
        
        <a href="/orders" class="btn btn-primary">Назад к списку заказов</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
