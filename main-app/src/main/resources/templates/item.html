<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.title}">Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Интернет-магазин</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart/items" sec:authorize="isAuthenticated()">Корзина</a>
            <a class="nav-link" href="/orders" sec:authorize="isAuthenticated()">Заказы</a>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Войти</a>
            <span class="nav-link" sec:authorize="isAuthenticated()" sec:authentication="name">Имя пользователя</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:text="${item.title}">Название товара</h1>
    
    <div sec:authorize="!isAuthenticated()">
        <div class="alert alert-warning">
            Для добавления товара в корзину необходимо <a href="/login">войти в систему</a>.
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <img th:src="${item.image}" class="img-fluid" alt="Изображение товара">
        </div>
        <div class="col-md-6">
            <p th:text="${item.description}">Описание товара</p>
            <h3><span th:text="${item.price}">Цена</span> руб.</h3>
            
            <form th:action="@{/items/{id}(id=${item.id})}" method="post" sec:authorize="isAuthenticated()">
                <input type="hidden" name="action" value="PLUS">
                <button type="submit" class="btn btn-success">В корзину</button>
            </form>
            
            <a href="/" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
