<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Интернет-магазин</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart/items" sec:authorize="isAuthenticated()">Корзина</a>
            <a class="nav-link" href="/orders" sec:authorize="isAuthenticated()">Заказы</a>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Войти</a>
            <span class="nav-link" sec:authorize="isAuthenticated()" sec:authentication="name">Имя пользователя</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Корзина</h1>
    
    <div sec:authorize="!isAuthenticated()">
        <div class="alert alert-warning">
            Для просмотра корзины необходимо <a href="/login">войти в систему</a>.
        </div>
    </div>
    
    <div sec:authorize="isAuthenticated()">
        <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
            Ваша корзина пуста.
        </div>
        
        <div th:unless="${#lists.isEmpty(items)}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Стоимость</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.title}">Название товара</td>
                        <td th:text="${item.price}">Цена</td>
                        <td th:text="${item.count}">Количество</td>
                        <td th:text="${item.price * item.count}">Стоимость</td>
                        <td>
                            <form th:action="@{/cart/items/{id}(id=${item.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="action" value="DELETE">
                                <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="row">
                <div class="col-md-6">
                    <h4>Итого: <span th:text="${total}">0</span> руб.</h4>
                </div>
                <div class="col-md-6 text-end">
                    <form th:action="@{/buy}" method="post">
                        <button type="submit" class="btn btn-success" 
                                th:if="${balance != null and total <= balance}">
                            Оформить заказ
                        </button>
                    </form>
                </div>
            </div>
            
            <div th:if="${balance != null and total > balance}" class="alert alert-warning mt-3">
                Недостаточно средств на балансе. Ваш баланс: <span th:text="${balance}">0</span> руб.
            </div>
        </div>
    </div>
</div>
</body>
</html>
