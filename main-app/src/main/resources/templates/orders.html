<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/main/items">Интернет-магазин</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart/items" sec:authorize="isAuthenticated()">Корзина</a>
            <a class="nav-link" href="/orders" sec:authorize="isAuthenticated()">Заказы</a>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Войти</a>
            <span class="nav-link" sec:authorize="isAuthenticated()" sec:authentication="name">Имя пользователя</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Заказы</h1>
    
    <div sec:authorize="!isAuthenticated()">
        <div class="alert alert-warning">
            Для просмотра заказов необходимо <a href="/login">войти в систему</a>.
        </div>
    </div>
    
    <div sec:authorize="isAuthenticated()">
        <table class="table">
            <thead>
                <tr>
                    <th>Номер заказа</th>
                    <th>Товары</th>
                    <th>Сумма</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${'Заказ №'+order.id}">Номер заказа</td>
                    <td>
                        <table class="table-sm">
                            <tr th:each="item : ${order.items}">
                                <td th:text="${item.title + ' (' + item.count + ' шт.) ' + (item.price * item.count) + ' руб.'}"></td>
                            </tr>
                        </table>
                    </td>
                    <td th:text="${order.totalSum() + ' руб.'}">Сумма</td>
                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-primary btn-sm">Просмотр</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
