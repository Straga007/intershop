server:
  port: 8080

spring:
  r2dbc:
    url: r2dbc:h2:file:///./data/db;AUTO_SERVER=TRUE
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 9
          max-idle: 9
          min-idle: 2
          max-wait: -1ms
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: myclient
            client-secret: myclientsecret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/myrealm
            user-name-attribute: preferred_username

payment:
  service:
    url: http://localhost:8081

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG